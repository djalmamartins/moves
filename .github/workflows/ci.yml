name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: moves_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MOVESOS_ENV: testing
      MOVESOS_TEST_DB: moves_test
      MOVESOS_TEST_DB_HOST: 127.0.0.1
      MOVESOS_TEST_DB_USER: root
      MOVESOS_TEST_DB_PASS: ""

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked
      - run: composer validate --strict
      - name: PHP syntax
        run: find source service tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
